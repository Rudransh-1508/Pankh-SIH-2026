[project]
name = "pankh-rules"
version = "0.1.0"
description = "MoTA scholarship scheme Rules as code, with Guideline citations"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openfisca-core>=45,<46",
    "pyyaml>=6",
]

[dependency-groups]
tools = [
    "httpx>=0.28",
    "pdfplumber>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pankh_rules"]
