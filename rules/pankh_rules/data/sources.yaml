# Official documents the scheme Rules are derived from.
# Every Rule citation points at one of these ids plus a PDF page (1-based) and paragraph.
# Documents are fetched and checked against their sha256 by tools/fetch_sources.py.
# `issued` is the date printed on the document; `effective` is the date it takes effect.
# Academic sessions are taken to start on 1 July (e.g. "2023-24 onwards" is effective 2023-07-01).
# All documents are published by the Ministry of Tribal Affairs at https://tribal.nic.in/ScholarshiP.aspx

