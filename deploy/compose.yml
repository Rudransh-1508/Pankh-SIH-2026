# Pankh on one server (Oracle Cloud Always Free, or any Linux VM): run from deploy/ with
#   docker compose up -d --build
# Settings come from deploy/.env (made by setup.sh from env.example).
name: pankh-deploy

x-pankh: &pankh
  env_file: .env
  environment: &pankh-env
    PANKH_ENVIRONMENT: production
    PANKH_DATABASE_URL: postgresql+asyncpg://pankh:${POSTGRES_PASSWORD}@postgres:5432/pankh
    PANKH_PUBLIC_API_URL: https://${API_DOMAIN}
    PANKH_CORS_ORIGINS: '["https://${DASHBOARD_DOMAIN}","https://${SIM_DOMAIN}"]'
    PANKH_DIGILOCKER_URL: https://${SIM_DOMAIN}/digilocker
    PANKH_REGISTERS_URL: http://simulators:8100
    PANKH_CPGRAMS_URL: http://simulators:8100/cpgrams
    PANKH_EXOTEL_URL: http://simulators:8100/exotel
    PANKH_OBJECT_STORE: s3
    PANKH_S3_ENDPOINT_URL: http://s3:8333
    PANKH_S3_ACCESS_KEY_ID: pankh
    PANKH_S3_SECRET_ACCESS_KEY: ${S3_SECRET}
    PANKH_TEMPORAL_ADDRESS: temporal:7233
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pankh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pankh
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pankh"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:latest
    # The image runs as a non-root user, and a fresh named volume belongs to root.
    user: root
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    volumes:
      - temporal-data:/data
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - s3-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  api:
    <<: *pankh
    build: { context: .., dockerfile: deploy/python.Dockerfile }
    image: pankh-python
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    <<: *pankh
    build: { context: .., dockerfile: deploy/python.Dockerfile }
    image: pankh-python
    command: ["python", "-m", "app.chasing.worker"]
    depends_on: [api, temporal]

  simulators:
    build: { context: .., dockerfile: deploy/python.Dockerfile }
    image: pankh-python
    command: ["uvicorn", "pankh_simulators.app:app", "--host", "0.0.0.0", "--port", "8100"]
    depends_on: [api]
    restart: unless-stopped

  dashboard:
    build: ../dashboard
    environment:
      PANKH_API_URL: http://api:8000/v1
    depends_on: [api]
    restart: unless-stopped

  voice:
    build: ../voice
    env_file: .env
    environment:
      PANKH_API_URL: http://api:8000
    depends_on: [api]
    restart: unless-stopped
    profiles: ["voice"]

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      SIM_DOMAIN: ${SIM_DOMAIN}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api, simulators, dashboard]
    restart: unless-stopped

volumes:
  postgres-data:
  temporal-data:
  s3-data:
  caddy-data:
