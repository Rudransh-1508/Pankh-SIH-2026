[project]
name = "pankh-backend"
version = "0.1.0"
description = "Pankh API: authentication, Facts, schemes and eligibility"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pankh-rules",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pyjwt>=2.10",
    "phonenumbers>=9",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.6",
    "indic-transliteration>=2.3.82",
    "cryptography>=50.0.1",
    "splink>=5.0.0",
    "temporalio>=1.33.0",
]

[dependency-groups]
dev = ["pankh-simulators"]

[tool.uv.sources]
pankh-rules = { workspace = true }
pankh-simulators = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
