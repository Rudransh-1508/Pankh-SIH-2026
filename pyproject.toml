[project]
name = "pankh"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["rules", "backend", "simulators"]
# The voice agent has its own environment (see voice/pyproject.toml).
exclude = ["voice"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25",
    "ruff>=0.12",
    "mypy>=1.17",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Prose read by people: wrapping it to the code line length hurts more than it helps.
"backend/app/jago/texts.py" = ["E501"]
"backend/app/phone/texts.py" = ["E501"]
"backend/app/letters/texts.py" = ["E501"]
"rules/pankh_rules/questions.py" = ["E501"]
"rules/pankh_rules/planner.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pankh_rules", "app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]
addopts = ["--import-mode=importlib"]
