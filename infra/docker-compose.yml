name: pankh

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pankh
      POSTGRES_PASSWORD: pankh
      POSTGRES_DB: pankh
    ports:
      - "${PANKH_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pankh"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Durable workflows for Agents, such as chasing stalled applications. Development server with
  # its web UI on http://localhost:8233. Start the worker with: uv run python -m app.chasing.worker
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data

  # S3-compatible object storage for encrypted Uploaded Documents (SeaweedFS; production uses
  # Amazon S3). Use it with PANKH_OBJECT_STORE=s3 PANKH_S3_ENDPOINT_URL=http://localhost:8333
  # PANKH_S3_ACCESS_KEY_ID=pankh PANKH_S3_SECRET_ACCESS_KEY=pankh-s3-secret. The API creates
  # its bucket if it is missing.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres-data:
  temporal-data:
  s3-data:
