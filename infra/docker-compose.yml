name: pankh

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pankh
      POSTGRES_PASSWORD: pankh
      POSTGRES_DB: pankh
    ports:
      - "${PANKH_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pankh"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
