# Pankh on Render. In Render: New → Blueprint → pick this repository. See deploy/RENDER.md.
# Everything is on free plans except the voice agent worker (Starter, about $7 a month). The
# database is a free Neon Postgres, which does not expire; its address is asked for at setup.
#
# Services reach each other by their public addresses, which Render derives from the names
# below. If Render says a name is taken, it adds a suffix: update the addresses marked
# "public address" in each service's Environment tab to match.

services:
  - type: web
    name: pankh-sih-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/python.Dockerfile
    dockerContext: .
    # Free services have no pre-deploy step, so migrations and demo seeding run at start.
    dockerCommand: /app/start-api.sh
    healthCheckPath: /health
    envVars:
      - key: PANKH_ENVIRONMENT
        value: production
      # A free Neon database's connection string (neon.tech): it does not expire, unlike
      # Render's free Postgres, which is deleted after 30 days.
      - key: PANKH_DATABASE_URL
        sync: false
      - key: PANKH_SECRET_KEY
        generateValue: true
      - key: PANKH_PHONE_WEBHOOK_TOKEN
        generateValue: true
      - key: PANKH_VOICE_SERVICE_TOKEN
        generateValue: true
      - key: PANKH_DEMO_SIGN_IN
        value: "true"
      # Public addresses of the other services
      - key: PANKH_CORS_ORIGINS
        value: '["https://pankh-sih-dashboard.onrender.com","https://pankh-sih-sim.onrender.com"]'
      - key: PANKH_DIGILOCKER_URL
        value: https://pankh-sih-sim.onrender.com/digilocker
      - key: PANKH_REGISTERS_URL
        value: https://pankh-sih-sim.onrender.com
      - key: PANKH_CPGRAMS_URL
        value: https://pankh-sih-sim.onrender.com/cpgrams
      - key: PANKH_EXOTEL_URL
        value: https://pankh-sih-sim.onrender.com/exotel
      # Photos: free services have no lasting disk. "file" keeps photos only until the next
      # restart; for a free Cloudflare R2 bucket, add PANKH_S3_ENDPOINT_URL,
      # PANKH_S3_ACCESS_KEY_ID and PANKH_S3_SECRET_ACCESS_KEY in the Environment tab and set
      # this to "s3" (see deploy/RENDER.md).
      - key: PANKH_OBJECT_STORE
        value: file
      - key: PANKH_S3_BUCKET
        value: pankh-documents
      - key: PANKH_S3_REGION
        value: auto
      # Voice: the LiveKit Cloud project (the voice worker below copies these)
      - key: PANKH_LIVEKIT_URL
        sync: false
      - key: PANKH_LIVEKIT_API_KEY
        sync: false
      - key: PANKH_LIVEKIT_API_SECRET
        sync: false
      # Optional, added later in the Environment tab: PANKH_FIREBASE_PROJECT_ID (real SMS
      # sign-in), and PANKH_BEDROCK_MODEL_ID with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
      # (JAGO on Bedrock).
      - key: PANKH_AWS_REGION
        value: ap-south-1

  - type: web
    name: pankh-sih-sim
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/python.Dockerfile
    dockerContext: .
    dockerCommand: /app/start-simulators.sh
    healthCheckPath: /health

  - type: web
    name: pankh-sih-dashboard
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: ./dashboard
    envVars:
      - key: PANKH_API_URL
        value: https://pankh-sih-api.onrender.com/v1

  # JAGO's voice agent must stay on, which Render offers only on a paid plan.
  - type: worker
    name: pankh-sih-voice
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./voice/Dockerfile
    dockerContext: ./voice
    envVars:
      - key: PANKH_API_URL
        value: https://pankh-sih-api.onrender.com
      - key: PANKH_SARVAM_API_KEY
        sync: false
      - key: PANKH_VOICE_SERVICE_TOKEN
        fromService:
          name: pankh-sih-api
          type: web
          envVarKey: PANKH_VOICE_SERVICE_TOKEN
      - key: PANKH_LIVEKIT_URL
        fromService:
          name: pankh-sih-api
          type: web
          envVarKey: PANKH_LIVEKIT_URL
      - key: PANKH_LIVEKIT_API_KEY
        fromService:
          name: pankh-sih-api
          type: web
          envVarKey: PANKH_LIVEKIT_API_KEY
      - key: PANKH_LIVEKIT_API_SECRET
        fromService:
          name: pankh-sih-api
          type: web
          envVarKey: PANKH_LIVEKIT_API_SECRET
