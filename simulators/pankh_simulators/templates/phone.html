<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone line</title>
<style>
  :root { --ink: #1B2A4A; --soft: #52607a; --peacock: #0E6F78; --mist: #e6f1f2; --line: #dfe5e3;
    --paper: #F5F7F6; --laterite: #B3412E; --leaf: #2F7D4F; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper);
    font-family: "Noto Sans", "Noto Sans Devanagari", system-ui, sans-serif; color: var(--ink); }
  .phone { width: min(360px, calc(100vw - 32px)); background: #fff; border: 1.5px solid var(--line);
    border-radius: 32px; padding: 24px 20px; box-shadow: 0 12px 40px rgba(27, 42, 74, .08); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: var(--soft); font-size: 13px; margin: 0 0 16px; }
  label { font-size: 13px; font-weight: 600; }
  input { width: 100%; margin: 6px 0 12px; padding: 12px 14px; font-size: 17px; border-radius: 12px;
    border: 1.5px solid var(--line); outline: none; letter-spacing: .04em; }
  input:focus { border-color: var(--peacock); }
  .screen { min-height: 140px; max-height: 240px; overflow-y: auto; background: var(--mist);
    border-radius: 16px; padding: 12px 14px; font-size: 15px; line-height: 1.5; margin-bottom: 16px; }
  .screen p { margin: 0 0 8px; }
  .screen .you { color: var(--soft); font-size: 13px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .keys button { height: 56px; border-radius: 28px; border: 1.5px solid var(--line); background: #fff;
    font-size: 22px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .keys button:disabled { color: #b8c0cc; cursor: default; }
  .keys button:not(:disabled):active { background: var(--mist); }
  .call { width: 100%; height: 52px; border: 0; border-radius: 26px; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--leaf); cursor: pointer; }
  .call.end { background: var(--laterite); }
</style>
</head>
<body>
<main class="phone">
  <h1>Pankh phone line</h1>
  <p class="muted">A stand-in for a phone: it calls the same menu Exotel does, and reads it aloud.</p>
  <label for="caller">Calling from</label>
  <input id="caller" inputmode="tel" value="09000000176" autocomplete="off">
  <div class="screen" id="screen" aria-live="polite"><p class="you">Press Call to start.</p></div>
  <div class="keys" id="keys"></div>
  <button class="call" id="call">Call</button>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const api = params.get("api") || "http://localhost:8000";
  const token = params.get("token") || "development-phone-token";
  const screen = document.getElementById("screen");
  const callButton = document.getElementById("call");
  let callSid = null;

  const keys = document.getElementById("keys");
  for (const key of ["1", "2", "3", "4", "5", "6", "7", "8", "9", "*", "0", "#"]) {
    const button = document.createElement("button");
    button.textContent = key;
    button.disabled = true;
    button.addEventListener("click", () => step(key));
    keys.append(button);
  }
  const setKeys = (on) => keys.querySelectorAll("button").forEach((b) => (b.disabled = !on));

  function show(text, cls) {
    const line = document.createElement("p");
    line.textContent = text;
    if (cls) line.className = cls;
    screen.append(line);
    screen.scrollTop = screen.scrollHeight;
  }

  function speak(text, language) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = language.startsWith("hi") ? "hi-IN" : "en-IN";
    utterance.rate = 0.95;
    speechSynthesis.speak(utterance);
  }

  async function step(digits) {
    if (!callSid) return;
    if (digits) show(`You pressed ${digits}`, "you");
    const response = await fetch(`${api}/v1/phone/ivr`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Phone-Token": token },
      body: JSON.stringify({ call_sid: callSid, caller: document.getElementById("caller").value, digits }),
    });
    if (!response.ok) { show(`The line is not answering (${response.status}).`); return hangUp(); }
    const prompt = await response.json();
    show(prompt.say);
    speak(prompt.say, prompt.language);
    if (prompt.hangup) hangUp();
  }

  async function hangUp() {
    if (callSid) {
      fetch(`${api}/v1/phone/ivr/${callSid}/end`, { method: "POST", headers: { "X-Phone-Token": token } });
    }
    callSid = null;
    setKeys(false);
    callButton.textContent = "Call";
    callButton.classList.remove("end");
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  }

  callButton.addEventListener("click", () => {
    if (callSid) return hangUp();
    callSid = `SIM${Date.now()}`;
    screen.innerHTML = "";
    setKeys(true);
    callButton.textContent = "End call";
    callButton.classList.add("end");
    step(null);
  });
</script>
</body>
</html>
