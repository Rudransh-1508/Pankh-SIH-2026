name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Rules and backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pankh
          POSTGRES_PASSWORD: pankh
          POSTGRES_DB: pankh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pankh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PANKH_DATABASE_URL: postgresql+asyncpg://pankh:pankh@localhost:5432/pankh_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  mobile:
    name: Student app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
